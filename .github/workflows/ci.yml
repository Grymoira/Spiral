name: Go and CMake baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Verify formatting
        run: |
          gofmt -d server
          test -z "$(gofmt -l server)"
      - name: Static analysis
        working-directory: server
        run: go vet ./...
      - name: Unit tests with race detector
        working-directory: server
        run: go test -race -count=1 ./...
      - name: Build server (Windows-safe output naming)
        working-directory: server
        run: go build -o "${{ runner.temp }}/spiral-server" ./cmd/spiral-server
      - name: Configure CMake without Qt
        run: cmake --preset server-only
      - name: Build CMake server target
        run: cmake --build --preset server-only
      - name: Execute CTest
        run: ctest --preset server-only --output-on-failure

  desktop-qt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 xvfb libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install Qt 6.8 desktop SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtwebsockets'
          cache: false
      - name: Configure Qt desktop client
        run: cmake --preset dev -DSPIRAL_BUILD_SERVER=OFF
      - name: Compile Qt desktop client
        run: cmake --build --preset dev --parallel 2
      - name: QML clock scheduling regression tests
        run: node client/tests/clock_scheduling.test.cjs
      - name: QML host command idempotency regressions
        run: node client/tests/control_idempotency.test.cjs
      - name: QML pending playback recovery regressions
        run: node client/tests/pending_recovery.test.cjs
      - name: QML event arming and commitment regressions
        run: node client/tests/arming_protocol.test.cjs
      - name: QML authoritative-contact partition safety regressions
        run: node client/tests/authority_partition.test.cjs
      - name: QML cancellation receipt and replay regressions
        run: node client/tests/cancellation_receipt.test.cjs
      - name: Transport URL and redirect security regressions
        run: |
          ctest --test-dir build/dev --output-on-failure -R spiral-transport-policy
          node client/tests/transport_gate.test.cjs
      - name: Headless QML startup smoke test
        run: |
          set +e
          timeout 8s xvfb-run -a env QT_QUICK_BACKEND=software QT_OPENGL=software ./build/dev/client/spiral-client > "$RUNNER_TEMP/spiral-qt-smoke.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/spiral-qt-smoke.log"
          # 124 means the desktop app stayed alive until deliberately stopped.
          if [ "$result" -ne 124 ]; then
            echo "Qt desktop terminated unexpectedly (code $result)"
            exit 1
          fi
          if grep -E 'QQmlApplicationEngine failed|module .* is not installed|Error loading QML file|ReferenceError:|TypeError:' "$RUNNER_TEMP/spiral-qt-smoke.log"; then
            echo "QML startup emitted runtime errors"
            exit 1
          fi
